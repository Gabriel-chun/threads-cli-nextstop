name: Dashboard CI

on:
  push:
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Test MCP Events
        run: npm run test:events
      - name: Test Signal Deck feedback profile
        run: npm run test:deck-feedback
      - name: Build
        run: npm run build
      - name: Runtime MCP discovery regression
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3100 >/tmp/nextstop-dashboard.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in {1..30}; do
            if curl -sSf http://127.0.0.1:3100/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/test-mcp-events.mjs
