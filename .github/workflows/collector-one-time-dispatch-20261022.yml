name: One-time Next Stop Collector Dispatch
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/collector-one-time-dispatch-20261022.yml"

permissions:
  actions: write

jobs:
  dispatch:
    if: startsWith(github.event.head_commit.message, 'ops: dispatch collector once')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger genuine manual Collector workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method POST "/repos/${GH_REPO}/actions/workflows/nextstop-collector.yml/dispatches" -f ref=main
          echo "Submitted workflow_dispatch for Next Stop Threads Collector"
