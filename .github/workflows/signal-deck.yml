name: Daily Signal Deck

on:
  schedule:
    # GitHub schedule delivery is best-effort, so wake several times in the morning.
    # A date gate below guarantees that only one real daily build is performed.
    - cron: "17,32,47 8 * * *"
      timezone: "Asia/Taipei"
    - cron: "2,17 9 * * *"
      timezone: "Asia/Taipei"
  workflow_run:
    workflows:
      - "Next Stop Threads Collector"
    types:
      - completed
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "collector/build_signal_deck.py"
      - ".github/workflows/signal-deck.yml"

permissions:
  contents: write

concurrency:
  group: nextstop-signal-deck
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.daily_gate.outputs.should_run }}
      reason: ${{ steps.daily_gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether today's deck needs a build
        id: daily_gate
        shell: bash
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          COLLECTOR_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          event = os.environ.get("TRIGGER_EVENT", "")
          collector_conclusion = os.environ.get("COLLECTOR_CONCLUSION", "")
          taipei = ZoneInfo("Asia/Taipei")
          now = datetime.now(timezone.utc).astimezone(taipei)

          def emit(should_run: bool, reason: str) -> None:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write(f"should_run={'true' if should_run else 'false'}\n")
                  f.write(f"reason={reason}\n")
              print(f"[signal-deck gate] should_run={should_run} reason={reason}")

          # Code/config changes should still validate and refresh immediately.
          if event in {"push", "workflow_dispatch"}:
              emit(True, f"{event}_forced")
              raise SystemExit

          if event == "workflow_run" and collector_conclusion != "success":
              emit(False, f"collector_{collector_conclusion or 'unknown'}")
              raise SystemExit

          # GitHub scheduled delivery is best-effort. Allow the first successful
          # collector after 07:00 Taipei to build today's deck so the morning
          # refresh does not depend on the 08:xx / 09:xx cron slots arriving.
          if now.hour < 7:
              emit(False, "before_07_taipei")
              raise SystemExit

          deck_path = Path("collector/archive/latest/signal_deck.json")
          if not deck_path.exists():
              emit(True, "deck_missing")
              raise SystemExit

          try:
              deck = json.loads(deck_path.read_text(encoding="utf-8"))
              generated_at = str(deck.get("generated_at") or "")
              if generated_at.endswith("Z"):
                  generated_at = generated_at[:-1] + "+00:00"
              generated = datetime.fromisoformat(generated_at)
              if generated.tzinfo is None:
                  generated = generated.replace(tzinfo=timezone.utc)
              deck_date = generated.astimezone(taipei).date()
          except Exception as exc:
              print(f"[signal-deck gate] could not read generated_at: {exc}")
              emit(True, "deck_timestamp_unreadable")
              raise SystemExit

          if deck_date == now.date():
              emit(False, "today_already_built")
          else:
              emit(True, f"stale_{deck_date.isoformat()}")
          PY

  build:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate Signal Deck
        run: python3 -m unittest collector/test_signal_deck.py

      - name: Build daily Signal Deck
        run: |
          python3 collector/build_signal_deck.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          deck = json.loads(Path("collector/archive/latest/signal_deck.json").read_text(encoding="utf-8"))
          print("[signal-deck] generated_at", deck["generated_at"])
          for key, window in deck["windows"].items():
              print(f"[signal-deck] {key}: cards={window['card_count']} signals={window['signal_count']}")
          PY

      - name: Commit Signal Deck snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collector/archive/latest/signal_deck.json
          if git diff --cached --quiet; then
            echo "[signal-deck] no changes"
            exit 0
          fi
          git commit -m "data: refresh daily signal deck"
          git pull --rebase origin main
          git push origin HEAD:main
