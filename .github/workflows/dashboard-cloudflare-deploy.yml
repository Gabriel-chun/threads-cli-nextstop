name: Dashboard Cloudflare Deploy

on:
  push:
    branches:
      - main
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nextstop-dashboard-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Test security and dashboard regressions
        run: |
          npm run test:events
          npm run test:deck-feedback
          npx tsx --test lib/reviewQuota.test.ts
          npx tsx --test lib/reviewArchive.test.ts
          npx tsx --test lib/reviewLedger.test.ts
          npx tsx --test lib/writeSecurity.test.ts

      - name: Build Cloudflare Worker bundle
        run: npm run build:vinext

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NEXTSTOP_EVENT_EMIT_TOKEN: ${{ secrets.NEXTSTOP_EVENT_EMIT_TOKEN }}
        run: npm run deploy:vinext
