name: Next Stop Live Public Preview — Cloudflare

on:
  push:
    branches:
      - feature/affiliate-intent-preview-20261027
    paths:
      - "site-preview/**"
      - ".github/workflows/public-preview-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nextstop-public-preview
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/feature/affiliate-intent-preview-20261027'
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed preview branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify standalone public assets
        shell: bash
        run: |
          set -euo pipefail
          test -f site-preview/public/index.html
          test -f site-preview/public/style.css
          test -f site-preview/public/robots.txt
          grep -qi 'noindex,nofollow' site-preview/public/index.html
          ! grep -Ei 'NOTION_TOKEN|NEXTSTOP_EVENT_EMIT_TOKEN|/api/mcp|/api/download' site-preview/public/* || { echo "Private/internal API references detected"; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require existing GitHub Cloudflare deployment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error title=Missing Cloudflare credentials::Reuse the same GitHub repository Actions secrets as Dashboard Cloudflare Deploy."
            exit 1
          fi

      - name: Deploy isolated public-preview Worker
        working-directory: site-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc

      - name: Verify HTTP response and private-route isolation
        shell: bash
        run: |
          set -euo pipefail
          base="https://nextstop-public-preview.gabrielchun336.workers.dev"
          for i in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$base/" -o /tmp/nextstop-preview.html; then break; fi
            sleep 3
          done
          grep -q 'NEXT STOP LIVE' /tmp/nextstop-preview.html
          grep -qi 'noindex,nofollow' /tmp/nextstop-preview.html
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$base/api/mcp")
          if [[ "$code" != "404" ]]; then
            echo "::error title=Public/private boundary::Expected /api/mcp to return 404, got $code"
            exit 1
          fi
          echo "Public preview deployed without private MCP route"
