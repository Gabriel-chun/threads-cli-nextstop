name: Hardening CI

on:
  pull_request:
  push:
    branches:
      - "hardening/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go tests
        run: go test ./...
      - name: Collector unit tests
        run: |
          python3 -m unittest collector/test_clean_rules.py
          python3 -m unittest collector/test_observation.py
          python3 -m unittest collector/test_signal_deck.py
          python3 -m unittest collector/test_relevance_profile.py
          python3 -m unittest collector/trend_tracking/test_trend_tracking.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dashboard bilingual UI regression
        working-directory: dashboard
        run: |
          npm install --no-audit --no-fund
          npm run test:i18n
          npm run check:i18n
          npm run build
          npm run build:vinext
      - name: Verify conservative collector boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn "playwright-extra\\|puppeteer-extra-plugin-stealth\\|navigator.webdriver\\|addInitScript" collector/collect_browser.mjs
          ! grep -RIn "THREADS_SESSION\\|THREADS_CSRF\\|THREADS_TOKEN" collector/collect_browser.mjs
          ! grep -RIn "THREADS_SESSION\\|THREADS_CSRF\\|THREADS_TOKEN" collector/collect.sh
          ! grep -RIn "COLLECTOR_GOOGLE_FALLBACK:.*true" .github/workflows/nextstop-collector.yml
          ! grep -RIn "THREADS_SESSION\|THREADS_CSRF\|THREADS_TOKEN" .github/workflows/nextstop-collector.yml
          ! grep -RIn "playwright-extra\|puppeteer-extra-plugin-stealth\|navigator.webdriver\|addInitScript" collector/trend_tracking
          ! grep -RIn "THREADS_SESSION\|THREADS_CSRF\|THREADS_TOKEN" collector/trend_tracking .github/workflows/trend-tracking.yml
          ! grep -RIn "COLLECTOR_GOOGLE_FALLBACK:.*true" .github/workflows/trend-tracking.yml
