name: Next Stop Threads Collector

on:
  schedule:
    # GitHub cron uses UTC. Observe Threads once per hour at minute 30.
    - cron: "30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nextstop-threads-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set run stamp
        run: |
          echo "RUN_STAMP=$(date -u +'%Y-%m-%d_%H%M%SZ')" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Threads CLI
        run: |
          mkdir -p bin
          go build -o bin/th ./cmd/th

      - name: Set up Node for Notion config
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Notion SDK
        run: npm install --no-save @notionhq/client@5.26.0

      - name: Load collector config from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_CONTROL_DATA_SOURCE_ID: "198328f3-d0b7-4fad-8740-5c5177cc1101"
        run: node collector/load_notion_config.mjs

      - name: Restore master database
        uses: actions/cache/restore@v4
        with:
          path: collector/state
          key: nextstop-master-${{ github.run_id }}
          restore-keys: |
            nextstop-master-

      - name: Reset run directories
        run: |
          rm -rf collector/raw collector/output
          mkdir -p collector/raw collector/output collector/state

      - name: Collect Threads snapshots
        env:
          QUERY_FILE: ${{ env.QUERY_FILE }}
        run: bash collector/collect.sh

      - name: Build snapshot and master files
        run: |
          python3 collector/build_snapshot.py \
            --raw-dir collector/raw \
            --output-dir collector/output \
            --state-dir collector/state \
            --min-score "$COLLECTOR_MIN_SCORE" \
            --since-hours "$COLLECTOR_WINDOW_HOURS" \
            --run-stamp "$RUN_STAMP"

      - name: Include collector diagnostics
        run: |
          cp collector/failed_queries.txt collector/output/failed_queries.txt
          cp "$QUERY_FILE" collector/output/queries.txt

      - name: Save master database
        uses: actions/cache/save@v4
        with:
          path: collector/state
          key: nextstop-master-${{ github.run_id }}

      - name: Upload downloadable snapshot
        uses: actions/upload-artifact@v4
        with:
          name: nextstop-threads-${{ env.RUN_STAMP }}
          path: collector/output/
          retention-days: 30
          if-no-files-found: error

      - name: Sync snapshot to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_POSTS_DATA_SOURCE_ID: "1d268bf4-2656-46c2-9ed1-b2143e611d3c"
          NOTION_RUNS_DATA_SOURCE_ID: "0f121a0f-3cfa-477c-be91-2bc61410dff4"
          NOTION_JSON_ARCHIVE_DATA_SOURCE_ID: "fb4c3b0b-8dbd-4604-826c-32d3bcb7b5c5"
          NOTION_QUERY_RUN_HISTORY_DATA_SOURCE_ID: "bd2b6fc3-f4ca-4b54-9def-84f9708a6b96"
          COLLECTOR_TRACK: ${{ env.COLLECTOR_TRACK }}
          COLLECTOR_CONFIG_KEY: ${{ env.COLLECTOR_CONFIG_KEY }}
          COLLECTOR_WINDOW_HOURS: ${{ env.COLLECTOR_WINDOW_HOURS }}
          COLLECTOR_MIN_SCORE: ${{ env.COLLECTOR_MIN_SCORE }}
          OUTPUT_DIR: collector/output
          QUERY_FILE: ${{ env.QUERY_FILE }}
          GITHUB_RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: node collector/sync_notion.mjs

      - name: Decide repository archive cadence
        id: archive_cadence
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          hour="$(date -u +'%H')"
          if [[ "$EVENT_NAME" == "workflow_dispatch" || $((10#$hour % 3)) -eq 0 ]]; then
            echo "commit=true" >> "$GITHUB_OUTPUT"
            echo "[archive] repository commit is due"
          else
            echo "commit=false" >> "$GITHUB_OUTPUT"
            echo "[archive] hourly observation only; repository commit is not due"
          fi

      - name: Commit collector data back to repo
        if: steps.archive_cadence.outputs.commit == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p collector/archive/latest
          mkdir -p collector/archive/snapshots
          mkdir -p collector/archive/runs

          cp collector/output/master.json collector/archive/latest/master.json
          cp collector/output/master.jsonl collector/archive/latest/master.jsonl
          cp collector/output/master.csv collector/archive/latest/master.csv

          cp collector/output/snapshot_"$RUN_STAMP".json collector/archive/snapshots/
          cp collector/output/snapshot_"$RUN_STAMP".jsonl collector/archive/snapshots/
          cp collector/output/snapshot_"$RUN_STAMP".csv collector/archive/snapshots/

          cp collector/output/summary.json collector/archive/runs/summary_"$RUN_STAMP".json
          cp collector/output/queries.txt collector/archive/runs/queries_"$RUN_STAMP".txt
          cp collector/output/failed_queries.txt collector/archive/runs/failed_queries_"$RUN_STAMP".txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add collector/archive/

          if git diff --cached --quiet; then
            echo "[archive] no repository changes to commit"
            exit 0
          fi

          git commit -m "data: collector snapshot $RUN_STAMP"
          git pull --rebase origin main
          git push origin HEAD:main
