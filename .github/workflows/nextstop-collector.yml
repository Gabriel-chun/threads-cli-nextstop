name: Next Stop Threads Collector

on:
  schedule:
    # GitHub scheduled events are best-effort and may be delayed or dropped.
    # Wake four times per hour, then gate against the latest successful archive.
    # Effective target: one real collection about every 2 hours, with redundant slots
    # so missed schedule events are less likely to create 4–7 hour gaps.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/nextstop-collector.yml"

permissions:
  contents: write

concurrency:
  group: nextstop-threads-collector
  cancel-in-progress: false

jobs:
  cadence:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      minutes_since_last: ${{ steps.gate.outputs.minutes_since_last }}
    steps:
      - name: Checkout cadence state
        uses: actions/checkout@v4

      - name: Decide whether collection is due
        id: gate
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os
          from datetime import datetime, timezone

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          if event != "schedule":
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write("should_run=true\n")
                  f.write("minutes_since_last=manual\n")
              print("[cadence] non-scheduled event; collector is allowed to run")
              raise SystemExit

          paths = sorted(glob.glob("collector/archive/runs/summary_*.json"))
          latest = None
          if paths:
              try:
                  with open(paths[-1], encoding="utf-8") as fh:
                      latest = json.load(fh).get("run_at")
              except Exception:
                  latest = None

          minutes = None
          if latest:
              try:
                  last = datetime.fromisoformat(latest.replace("Z", "+00:00")).astimezone(timezone.utc)
                  minutes = (datetime.now(timezone.utc) - last).total_seconds() / 60
              except Exception:
                  minutes = None

          should_run = minutes is None or minutes >= 120
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"should_run={'true' if should_run else 'false'}\n")
              f.write(f"minutes_since_last={minutes:.1f}\n" if minutes is not None else "minutes_since_last=unknown\n")

          print(f"[cadence] last archive age: {minutes if minutes is not None else 'unknown'} minutes")
          print(f"[cadence] should_run={should_run}")
          PY

  collect:
    needs: cadence
    if: needs.cadence.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set run stamp
        run: |
          echo "RUN_STAMP=$(date -u +'%Y-%m-%d_%H%M%SZ')" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Threads CLI
        run: |
          mkdir -p bin
          go build -o bin/th ./cmd/th

      - name: Validate clean rules
        run: python3 -m unittest collector/test_clean_rules.py

      - name: Set up Node for Notion config
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Notion SDK
        run: npm install --no-save @notionhq/client@5.26.0

      - name: Load collector config from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_CONTROL_DATA_SOURCE_ID: "198328f3-d0b7-4fad-8740-5c5177cc1101"
        run: node collector/load_notion_config.mjs

      - name: Restore master database
        uses: actions/cache/restore@v4
        with:
          path: collector/state
          key: nextstop-master-${{ github.run_id }}
          restore-keys: |
            nextstop-master-

      - name: Seed master from repository archive when cache is unavailable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p collector/state
          if [[ ! -s collector/state/master.jsonl && -s collector/archive/latest/master.jsonl ]]; then
            cp collector/archive/latest/master.jsonl collector/state/master.jsonl
            if [[ -s collector/archive/latest/master.csv ]]; then
              cp collector/archive/latest/master.csv collector/state/master.csv
            fi
            echo "[state] seeded master from repository archive"
          else
            echo "[state] cache/state already available; archive seed not needed"
          fi

      - name: Reset run directories
        run: |
          rm -rf collector/raw collector/output
          mkdir -p collector/raw collector/output collector/state

      - name: Collect Threads snapshots
        env:
          QUERY_FILE: ${{ env.QUERY_FILE }}
        run: bash collector/collect.sh

      - name: Build snapshot and master files
        run: |
          python3 collector/build_snapshot.py \
            --raw-dir collector/raw \
            --output-dir collector/output \
            --state-dir collector/state \
            --min-score "$COLLECTOR_MIN_SCORE" \
            --since-hours "$COLLECTOR_WINDOW_HOURS" \
            --run-stamp "$RUN_STAMP"

      - name: Include collector diagnostics
        run: |
          cp collector/failed_queries.txt collector/output/failed_queries.txt
          cp "$QUERY_FILE" collector/output/queries.txt

      - name: Build direct-download JSON archives
        shell: bash
        run: |
          set -euo pipefail
          snapshot_json="collector/output/snapshot_${RUN_STAMP}.json"
          snapshot_zip="collector/output/snapshot_${RUN_STAMP}.zip"
          master_json="collector/output/master.json"
          master_zip="collector/output/master.zip"

          zip -j -q "$snapshot_zip" "$snapshot_json"
          zip -j -q "$master_zip" "$master_json"

          unzip -t "$snapshot_zip"
          unzip -t "$master_zip"

      - name: Save master database
        uses: actions/cache/save@v4
        with:
          path: collector/state
          key: nextstop-master-${{ github.run_id }}

      - name: Upload downloadable snapshot
        uses: actions/upload-artifact@v4
        with:
          name: nextstop-threads-${{ env.RUN_STAMP }}
          path: collector/output/
          retention-days: 30
          if-no-files-found: error

      - name: Sync snapshot to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_POSTS_DATA_SOURCE_ID: "1d268bf4-2656-46c2-9ed1-b2143e611d3c"
          NOTION_RUNS_DATA_SOURCE_ID: "0f121a0f-3cfa-477c-be91-2bc61410dff4"
          NOTION_JSON_ARCHIVE_DATA_SOURCE_ID: "fb4c3b0b-8dbd-4604-826c-32d3bcb7b5c5"
          NOTION_QUERY_RUN_HISTORY_DATA_SOURCE_ID: "bd2b6fc3-f4ca-4b54-9def-84f9708a6b96"
          NOTION_DUPLICATE_REVIEW_DATA_SOURCE_ID: "fc925420-287c-4e42-9c68-b8ad2fd385a4"
          COLLECTOR_TRACK: ${{ env.COLLECTOR_TRACK }}
          COLLECTOR_CONFIG_KEY: ${{ env.COLLECTOR_CONFIG_KEY }}
          COLLECTOR_WINDOW_HOURS: ${{ env.COLLECTOR_WINDOW_HOURS }}
          COLLECTOR_MIN_SCORE: ${{ env.COLLECTOR_MIN_SCORE }}
          OUTPUT_DIR: collector/output
          QUERY_FILE: ${{ env.QUERY_FILE }}
          GITHUB_RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: node collector/sync_notion.mjs

      - name: Fail workflow when every query failed
        shell: bash
        run: |
          set -euo pipefail
          total_queries="$(awk 'NF && $1 !~ /^#/ {count++} END {print count+0}' "$QUERY_FILE")"
          failed_queries="$(awk 'NF {count++} END {print count+0}' collector/failed_queries.txt)"

          echo "[quality] total queries=$total_queries failed queries=$failed_queries"

          if [[ "$total_queries" -gt 0 && "$failed_queries" -ge "$total_queries" ]]; then
            echo "::error::All collector queries failed. Notion recorded the run as Failed; the successful archive will not advance."
            exit 1
          fi

      - name: Decide repository archive cadence
        id: archive_cadence
        shell: bash
        run: |
          set -euo pipefail
          echo "commit=true" >> "$GITHUB_OUTPUT"
          echo "[archive] commit every successful collector run"

      - name: Commit collector data back to repo
        if: steps.archive_cadence.outputs.commit == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p collector/archive/latest
          mkdir -p collector/archive/snapshots
          mkdir -p collector/archive/runs

          cp collector/output/master.json collector/archive/latest/master.json
          cp collector/output/master.jsonl collector/archive/latest/master.jsonl
          cp collector/output/master.csv collector/archive/latest/master.csv

          cp collector/output/snapshot_"$RUN_STAMP".json collector/archive/snapshots/
          cp collector/output/snapshot_"$RUN_STAMP".jsonl collector/archive/snapshots/
          cp collector/output/snapshot_"$RUN_STAMP".csv collector/archive/snapshots/

          cp collector/output/summary.json collector/archive/runs/summary_"$RUN_STAMP".json
          cp collector/output/queries.txt collector/archive/runs/queries_"$RUN_STAMP".txt
          cp collector/output/failed_queries.txt collector/archive/runs/failed_queries_"$RUN_STAMP".txt
          cp collector/output/duplicate_review.json collector/archive/runs/duplicate_review_"$RUN_STAMP".json

          python3 - <<'PY'
          import json
          from pathlib import Path

          history_path = Path("collector/archive/latest/history.json")
          summary_path = Path("collector/output/summary.json")

          try:
              history = json.loads(history_path.read_text(encoding="utf-8"))
              if not isinstance(history, list):
                  history = []
          except Exception:
              history = []

          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          row = {
              "run_at": summary.get("run_at"),
              "run_stamp": summary.get("run_stamp"),
              "pipeline_version": summary.get("pipeline_version"),
              "raw_rows": summary.get("raw_rows", 0),
              "dedupe_unique_signals": summary.get("dedupe_unique_signals", 0),
              "unique_signals": summary.get("unique_signals", 0),
              "excluded_transactions": summary.get("excluded_transactions", 0),
              "clean_rate_pct": summary.get("clean_rate_pct", 0),
              "new_3h": summary.get("new_3h", 0),
              "new_12h": summary.get("new_12h", 0),
              "master_unique_rows": summary.get("master_unique_rows", 0),
              "status": "Success",
          }

          history = [item for item in history if item.get("run_stamp") != row["run_stamp"]]
          history.append(row)
          history.sort(key=lambda item: item.get("run_at") or "")
          history = history[-84:]
          history_path.write_text(
              json.dumps(history, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"[history] wrote {len(history)} trend points")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add collector/archive/

          if git diff --cached --quiet; then
            echo "[archive] no repository changes to commit"
            exit 0
          fi

          git commit -m "data: collector snapshot $RUN_STAMP"
          git pull --rebase origin main
          git push origin HEAD:main
