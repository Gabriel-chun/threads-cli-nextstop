name: Next Stop Threads Collector

on:
  schedule:
    # GitHub cron uses UTC. These are 00:30 and 12:30 in Taiwan (UTC+8).
    - cron: "30 16,4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nextstop-threads-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set run stamp
        run: |
          echo "RUN_STAMP=$(date -u +'%Y-%m-%d_%H%M%SZ')" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Threads CLI
        run: |
          mkdir -p bin
          go build -o bin/th ./cmd/th

      - name: Set up Node for Notion config
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Notion SDK
        run: npm install --no-save @notionhq/client@5.26.0

      - name: Load collector config from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_CONTROL_DATA_SOURCE_ID: "198328f3-d0b7-4fad-8740-5c5177cc1101"
        run: node collector/load_notion_config.mjs

      - name: Restore master database
        uses: actions/cache/restore@v4
        with:
          path: collector/state
          key: nextstop-master-${{ github.run_id }}
          restore-keys: |
            nextstop-master-

      - name: Reset run directories
        run: |
          rm -rf collector/raw collector/output
          mkdir -p collector/raw collector/output collector/state

      - name: Collect Threads snapshots
        env:
          QUERY_FILE: ${{ env.QUERY_FILE }}
        run: bash collector/collect.sh

      - name: Build snapshot and master files
        run: |
          python3 collector/build_snapshot.py \
            --raw-dir collector/raw \
            --output-dir collector/output \
            --state-dir collector/state \
            --min-score "$COLLECTOR_MIN_SCORE" \
            --since-hours "$COLLECTOR_WINDOW_HOURS" \
            --run-stamp "$RUN_STAMP"

      - name: Include collector diagnostics
        run: |
          cp collector/failed_queries.txt collector/output/failed_queries.txt
          cp "$QUERY_FILE" collector/output/queries.txt

      - name: Save master database
        uses: actions/cache/save@v4
        with:
          path: collector/state
          key: nextstop-master-${{ github.run_id }}

      - name: Upload downloadable snapshot
        uses: actions/upload-artifact@v4
        with:
          name: nextstop-threads-${{ env.RUN_STAMP }}
          path: collector/output/
          retention-days: 30
          if-no-files-found: error

      - name: Sync snapshot to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_POSTS_DATA_SOURCE_ID: "1d268bf4-2656-46c2-9ed1-b2143e611d3c"
          NOTION_RUNS_DATA_SOURCE_ID: "0f121a0f-3cfa-477c-be91-2bc61410dff4"
          NOTION_JSON_ARCHIVE_DATA_SOURCE_ID: "fb4c3b0b-8dbd-4604-826c-32d3bcb7b5c5"
          OUTPUT_DIR: collector/output
          QUERY_FILE: ${{ env.QUERY_FILE }}
          GITHUB_RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: node collector/sync_notion.mjs
