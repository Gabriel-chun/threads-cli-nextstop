name: Production MCP Smoke

on:
  push:
    branches:
      - main
    paths:
      - "dashboard/scripts/test-mcp-events.mjs"
      - ".github/workflows/production-mcp-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify deployed MCP and Trend Radar response
        working-directory: dashboard
        env:
          MCP_TEST_URL: "https://threads-cli-nextstop.gabrielchun336.workers.dev/api/mcp"
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "[production-mcp] attempt $attempt"
            if node scripts/test-mcp-events.mjs; then
              exit 0
            fi
            sleep 20
          done
          exit 1
